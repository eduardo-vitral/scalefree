[tool.poetry]
name = "scalefree"
version = "0.3.0"
description = "Scale-free DF velocity moments and VP calculations with a Fortran backend."
authors = [
  "Eduardo Vitral <eduardo.vitral@roe.ac.uk>",
  "Roeland van der Marel <marel@stsci.edu>",
]
license = "MIT"
readme = "README.md"
homepage = "https://gitlab.com/eduardo-vitral/scalefree"
repository = "https://gitlab.com/eduardo-vitral/scalefree"
keywords = [
  "astronomy",
  "dynamics",
  "distribution-function",
  "fortran",
  "kinematics",
  "velocity-profile",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Fortran",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Astronomy",
]
packages = [{ include = "scalefree" }]

# Include non-Python files in sdist/wheel (Fortran sources; docs)
include = [
  { path = "fortran_src", format = "sdist" },
  { path = "fortran_src", format = "wheel" },
  { path = "README.md", format = "sdist" },
  { path = "README.md", format = "wheel" },
  { path = "ROTATION.md", format = "sdist" },
  { path = "VPOS.md", format = "sdist" },
  { path = "VPSHAPES.md", format = "sdist" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.23"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
ruff = ">=0.4.0"

[tool.poetry.scripts]
# Optional: a CLI that builds the Fortran executable (you can implement later)
# scalefree-build = "scalefree.vmoments:build_fortran_cli"
# Optional: quick runner (not required; dev convenience)
# scalefree-quick = "scalefree.vmoments:quick_cli"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
