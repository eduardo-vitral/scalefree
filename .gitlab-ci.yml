stages:
  - test
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - poetry.lock
      - pyproject.toml
  paths:
    - .venv/
    - .cache/pypoetry/
    - .cache/pip/

test:
  image: python:${PY_VER}
  parallel:
    matrix:
      - PY_VER: ["3.10", "3.11", "3.12"]
  stage: test
  before_script:
    - python -V
    - pip install poetry==1.8.4
    - poetry --version
    - poetry install --no-ansi
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends gfortran
    - rm -f fortran_src/scalefree.e
    - gfortran -O2 -std=legacy -ffixed-line-length-none -Wline-truncation -o fortran_src/scalefree.e fortran_src/scalefree.f
    - poetry run pytest -q

build:
  image: python:3.11
  stage: build
  needs: ["test"]
  before_script:
    - python -V
    - pip install poetry==1.8.4
    - poetry --version
    - poetry install --no-ansi
  script:
    - poetry build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
